<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Attendance Scanner</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#111111" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h2 { margin: 8px 0; font-size: 18px; text-align: center; }
  #reader {
    width: 100%;
    max-width: 420px;
    border-radius: 12px;
    overflow: hidden;
  }
  #status {
    margin-top: 16px;
    width: 100%;
    max-width: 420px;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    background: #333;
    transition: background 0.2s;
  }
  #status.success { background: #1b8a3a; }
  #status.error { background: #a33; }
  #setup {
    width: 100%;
    max-width: 420px;
    margin-bottom: 12px;
  }
  #setup input {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border-radius: 8px;
    border: none;
    margin-bottom: 8px;
  }
  #setup button {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-weight: bold;
  }
  #log {
    width: 100%;
    max-width: 420px;
    margin-top: 12px;
    font-size: 12px;
    color: #999;
    max-height: 100px;
    overflow-y: auto;
  }
  #manualRow, #uploadRow {
    display: none;
    width: 100%;
    max-width: 420px;
    margin-top: 12px;
    gap: 8px;
  }
  #manualRow input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
  }
  #manualRow button, #uploadRow label {
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #uploadRow { display: none; }
  #uploadRow input[type=file] { display: none; }
  #changeUrlLink {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
    text-decoration: underline;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>

<h2>Student Attendance Scanner</h2>

<div id="setup">
  <input type="text" id="scriptUrl" placeholder="Paste your Apps Script Web App URL here" />
  <button onclick="startScanner()">Start Scanning</button>
</div>

<div id="reader" style="display:none;"></div>
<div id="status">Enter your script URL above and tap Start</div>

<div id="manualRow" style="display:none;">
  <input type="text" id="manualId" placeholder="Type Student ID" inputmode="numeric" />
  <button onclick="submitManualId()">Log</button>
</div>

<div id="uploadRow" style="display:none;">
  <label for="photoUpload">Upload ID Photo</label>
  <input type="file" id="photoUpload" accept="image/*" onchange="handlePhotoUpload(event)" />
</div>

<div id="changeUrlLink" onclick="changeUrl()">Change Web App URL</div>

<div id="log"></div>

<script>
let html5QrCode;
let cooldown = false;

function log(msg) {
  const logEl = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = msg;
  logEl.prepend(line);
}

function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = type || "";
}

// Remember the script URL on this phone so it doesn't need re-pasting each time.
window.addEventListener("DOMContentLoaded", () => {
  try {
    const saved = localStorage.getItem("attendanceScriptUrl");
    if (saved) {
      document.getElementById("scriptUrl").value = saved;
    }
  } catch (e) {
    // localStorage can fail in private/incognito mode - not critical, just skip
  }
});

// Register the service worker - required for Chrome's "Install app" prompt.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.log("Service worker registration failed:", err);
    });
  });
}

async function startScanner() {
  const url = document.getElementById("scriptUrl").value.trim();
  if (!url) {
    alert("Paste your Apps Script Web App URL first.");
    return;
  }
  window.SCRIPT_URL = url;
  try {
    localStorage.setItem("attendanceScriptUrl", url);
  } catch (e) {
    // ignore storage errors, non-critical
  }

  document.getElementById("setup").style.display = "none";
  document.getElementById("reader").style.display = "block";
  document.getElementById("manualRow").style.display = "flex";
  document.getElementById("uploadRow").style.display = "flex";
  document.getElementById("changeUrlLink").style.display = "block";

  html5QrCode = new Html5Qrcode("reader");
  const config = {
    fps: 10,
    qrbox: { width: 280, height: 120 },
    formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_39 ]
  };

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      () => {}
    );
    setStatus("Ready — point camera at ID barcode", "");
  } catch (err) {
    setStatus("Camera error: " + err, "error");
  }
}

function onScanSuccess(decodedText) {
  if (cooldown) return;
  cooldown = true;
  processId(decodedText.trim());
}

function submitManualId() {
  const input = document.getElementById("manualId");
  const id = input.value.trim();
  if (!id) return;
  input.value = "";
  processId(id);
}

function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  setStatus("Reading barcode from photo...", "");

  // html5-qrcode can decode a barcode from a static image file directly,
  // using a temporary hidden scanner instance separate from the live camera one.
  const tempScannerId = "temp-file-reader";
  let tempDiv = document.getElementById(tempScannerId);
  if (!tempDiv) {
    tempDiv = document.createElement("div");
    tempDiv.id = tempScannerId;
    tempDiv.style.display = "none";
    document.body.appendChild(tempDiv);
  }

  const fileScanner = new Html5Qrcode(tempScannerId);
  fileScanner.scanFile(file, false)
    .then(decodedText => {
      processId(decodedText.trim());
      fileScanner.clear();
    })
    .catch(err => {
      setStatus("Could not read barcode from photo — try manual entry", "error");
      fileScanner.clear();
    });

  event.target.value = "";
}

function changeUrl() {
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {}).finally(resetToSetup);
  } else {
    resetToSetup();
  }
}

function resetToSetup() {
  document.getElementById("setup").style.display = "flex";
  document.getElementById("setup").style.flexDirection = "column";
  document.getElementById("reader").style.display = "none";
  document.getElementById("manualRow").style.display = "none";
  document.getElementById("uploadRow").style.display = "none";
  document.getElementById("changeUrlLink").style.display = "none";
  setStatus("Enter your script URL above and tap Start", "");
}

function processId(id) {
  setStatus("Scanned: " + id + " — sending...", "");

  fetch(window.SCRIPT_URL + "?id=" + encodeURIComponent(id))
    .then(res => res.json())
    .then(data => {
      if (data.status === "ok") {
        const fullName = data.firstName + " " + data.lastName;
        setStatus("✓ " + fullName + " — " + data.grade, "success");
        log(fullName + " (" + data.grade + ") logged at " + new Date().toLocaleTimeString());
      } else if (data.status === "not_found") {
        setStatus("⚠ ID " + data.id + " not found", "error");
        log("Unrecognized ID: " + data.id);
      } else {
        setStatus("Error: " + data.message, "error");
      }
    })
    .catch(err => {
      setStatus("Network error — check connection", "error");
      log("Failed to send " + id);
    })
    .finally(() => {
      setTimeout(() => {
        cooldown = false;
        setStatus("Ready — point camera at ID barcode", "");
      }, 2000);
    });
}
</script>

</body>
</html>
