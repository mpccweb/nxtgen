<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NXTGEN — ID Release</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #e8631a;
    --blue:   #4da6e8;
    --dark:   #1a1a2e;
    --green:  #188038;
    --green-bg: #e6f4ea;
    --green-border: #a8d5b5;
    --gray:   #f5f6fa;
    --border: #e0e0e0;
    --text:   #1a1a2e;
    --soft:   #6b7280;
    --white:  #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--gray);
    min-height: 100vh;
    color: var(--text);
  }

  /* ── HEADER ── */
  .header {
    background: var(--dark);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header img { width: 44px; height: 44px; object-fit: contain; }
  .header-text h1 { font-size: 16px; font-weight: 900; color: var(--white); }
  .header-text p  { font-size: 11px; color: #aaa; margin-top: 1px; }

  /* ── SEARCH ── */
  .search-wrap {
    padding: 20px 16px 0;
    max-width: 480px;
    margin: 0 auto;
  }
  .search-label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--soft);
    margin-bottom: 6px;
  }
  .search-box {
    display: flex;
    gap: 8px;
  }
  .search-box input {
    flex: 1;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    background: var(--white);
    outline: none;
  }
  .search-box input:focus { border-color: var(--blue); }
  .btn-search {
    padding: 11px 18px;
    background: var(--dark);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-search:hover { background: #2d2d4e; }
  .search-hint {
    font-size: 11px;
    color: var(--soft);
    margin-top: 6px;
  }

  /* ── RESULT CARD ── */
  .result-wrap {
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .student-card {
    background: var(--white);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border: 1.5px solid var(--border);
  }
  .card-header {
    background: var(--dark);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-header .name { font-size: 22px; font-weight: 900; color: var(--white); }
  .card-header .grade { font-size: 12px; color: var(--blue); font-weight: 700; margin-top: 2px; }
  .status-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .status-new     { background: #fff8e1; color: #f59e0b; border: 1px solid #fcd34d; }
  .status-active  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .status-updated { background: #fff3e0; color: #e8631a; border: 1px solid #ffcc80; }

  .card-body { padding: 16px; }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--soft); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-value { font-weight: 800; color: var(--text); text-align: right; }

  .card-footer { padding: 0 16px 16px; }

  /* ── RECEIVE BUTTON ── */
  .btn-receive {
    width: 100%;
    padding: 14px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.2s;
  }
  .btn-receive:hover { background: #146c2e; }
  .btn-receive:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .received-banner {
    background: var(--green-bg);
    border: 1.5px solid var(--green-border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .received-banner .rb-icon { font-size: 28px; flex-shrink: 0; }
  .received-banner .rb-text { flex: 1; }
  .received-banner .rb-title { font-size: 14px; font-weight: 900; color: var(--green); }
  .received-banner .rb-sub   { font-size: 11px; color: #555; margin-top: 2px; }
  .card-done .card-header { background: #2d4a35; }
  .card-done .grade { color: #a8d5b5 !important; }

  .already-received {
    width: 100%;
    padding: 14px;
    background: var(--green-bg);
    color: var(--green);
    border: 1.5px solid var(--green-border);
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
  }

  /* ── CONFIRMATION MODAL ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal h2 { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
  .modal p  { font-size: 13px; color: var(--soft); line-height: 1.5; margin-bottom: 20px; }
  .modal-child { font-size: 20px; font-weight: 900; color: var(--dark); margin: 8px 0 16px; }
  .modal-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 800;
    cursor: pointer; color: var(--soft);
  }
  .btn-confirm {
    flex: 2; padding: 12px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 900;
    cursor: pointer;
  }
  .btn-confirm:hover { background: #146c2e; }

  /* ── TOAST ── */
  .toast {
    display: none;
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.success { background: var(--green); }
  .toast.error   { background: #dc2626; }
  .toast.show    { display: block; }

  /* ── EMPTY / ERROR STATES ── */
  .state-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--soft);
    font-size: 14px;
    font-weight: 600;
  }
  .state-msg .icon { font-size: 36px; margin-bottom: 10px; }

  .loader { text-align: center; padding: 30px; color: var(--soft); font-weight: 700; }
</style>
</head>

  <div class="header-text">
    <h1>NXTGEN Alabang</h1>
    <p>ID Release Confirmation</p>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-label">Search Student</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Name or Student ID..." autocomplete="off"
      onkeydown="if(event.key==='Enter') searchStudent()">
    <button class="btn-search" onclick="searchStudent()">🔍 Search</button>
  </div>
  <div class="search-hint">Type the student's name or ID number, then press Search.</div>
</div>

<!-- RESULTS -->
<div class="result-wrap" id="resultWrap"></div>

<!-- CONFIRMATION MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon">🪪</div>
    <h2>Confirm ID Receipt</h2>
    <p>Please confirm that the parent/guardian has received the physical ID for:</p>
    <div class="modal-child" id="modalChildName">—</div>
    <p>An email confirmation will be sent to the parent automatically.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Go Back</button>
      <button class="btn-confirm" onclick="confirmReceived()">✅ Yes, Received</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const WEBAPP = 'https://script.google.com/macros/s/AKfycbwJYURL8cwlfe3L4dpj4uBfMXeuk0RRtRTHyyL1y9ERYsUQhBeAncu134p_KaifXf00_w/exec';
let currentStudent = null;



function renderCard(s, index) {
  const fullName   = s.lastName + ', ' + s.firstName;
  const nickname   = s.nickname || s.firstName;
  const contact    = s.parentContact || s.guardianContact || 'N/A';
  const statusHtml = getStatusBadge(s.status || '');
  const actionHtml = s.status === 'active'
    ? '<div class="already-received">✅ ID Already Received</div>'
    : '<button class="btn-receive" onclick="openModal(' + index + ')">🪪 I Received My Child\'s ID</button>';

  return `
    <div class="student-card" style="margin-bottom:12px;" id="card-${index}" data-index="${index}">
      <div class="card-header">
        <div>
          <div class="name">${nickname}</div>
          <div class="grade">${s.grade} &nbsp;·&nbsp; ID: ${s.id}</div>
        </div>
        ${statusHtml}
      </div>
      <div class="card-body">
        <div class="info-row">
          <span class="info-label">Full Name</span>
          <span class="info-value">${fullName}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Parent Contact</span>
          <span class="info-value">${contact}</span>
        </div>
      </div>
      <div class="card-footer">${actionHtml}</div>
    </div>
  `;
}

function getStatusBadge(status) {
  if (status === 'active')  return '<span class="status-badge status-active">✅ Received</span>';
  if (status === 'updated') return '<span class="status-badge status-updated">🟠 Updated</span>';
  return '<span class="status-badge status-new">🟡 New</span>';
}

let searchResults = [];

async function searchStudent() {
  const query = document.getElementById('searchInput').value.trim();
  const wrap  = document.getElementById('resultWrap');
  if (!query) { showToast('Please enter a name or ID.', 'error'); return; }

  wrap.innerHTML = '<div class="loader">⏳ Searching...</div>';

  try {
    const res  = await fetch(WEBAPP + '?action=searchStudents');
    const data = await res.json();

    if (data.status !== 'success') {
      wrap.innerHTML = '<div class="state-msg"><div class="icon">⚠️</div>Could not connect to database.</div>';
      return;
    }

    const q = query.toLowerCase();
    searchResults = data.students.filter(s => {
      const fullName = (s.lastName + ' ' + s.firstName).toLowerCase();
      const nickname = (s.nickname || '').toLowerCase();
      return fullName.includes(q) || s.id.includes(q) || nickname.includes(q);
    }).slice(0, 5);

    if (searchResults.length === 0) {
      wrap.innerHTML = '<div class="state-msg"><div class="icon">🔍</div>No student found for "' + query + '"</div>';
      return;
    }

    wrap.innerHTML = searchResults.map((s, i) => renderCard(s, i)).join('');

  } catch(err) {
    wrap.innerHTML = '<div class="state-msg"><div class="icon">⚠️</div>Network error. Check your connection.</div>';
  }
}



let currentCardIndex = null;

function openModal(index) {
  currentStudent   = searchResults[index];
  currentCardIndex = index;
  if (!currentStudent) return;
  const nickname  = currentStudent.nickname || currentStudent.firstName;
  const fullName  = currentStudent.lastName + ', ' + currentStudent.firstName;
  document.getElementById('modalChildName').textContent = nickname + ' (' + fullName + ')';
  document.getElementById('overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

async function confirmReceived() {
  if (!currentStudent) return;
  document.querySelector('.btn-confirm').disabled = true;
  document.querySelector('.btn-confirm').textContent = '⏳ Processing...';

  try {
    const res = await fetch(WEBAPP, {
      method: 'POST',
      body: JSON.stringify({
        action:    'markIdReceived',
        studentId: currentStudent.id,
      }),
      headers: { 'Content-Type': 'text/plain' }
    });
    const result = await res.json();

    closeModal();

    if (result.status === 'success') {
      showToast('✅ ID receipt confirmed! Email sent to parent.', 'success');

      // Update card in place
      const card = document.getElementById('card-' + currentCardIndex);
      if (card) {
        card.classList.add('card-done');
        const badge = card.querySelector('.status-badge');
        if (badge) {
          badge.className   = 'status-badge status-active';
          badge.textContent = '✅ Received';
        }
        const now     = new Date();
        const timeStr = now.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
        const footer  = card.querySelector('.card-footer');
        if (footer) {
          footer.innerHTML = `
            <div class="received-banner">
              <div class="rb-icon">🪪</div>
              <div class="rb-text">
                <div class="rb-title">ID Successfully Received</div>
                <div class="rb-sub">Confirmed ${dateStr} at ${timeStr} · Email sent to parent</div>
              </div>
            </div>`;
        }
      }
    } else {
      showToast('Something went wrong. Try again.', 'error');
    }
  } catch(err) {
    showToast('Network error. Try again.', 'error');
  } finally {
    document.querySelector('.btn-confirm').disabled = false;
    document.querySelector('.btn-confirm').textContent = '✅ Yes, Received';
  }
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

// Allow Enter key on search
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchStudent();
});
</script>
